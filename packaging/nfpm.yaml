name: smith-cli
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Arzaroth <gitea@barrut.me>
description: |-
  Forgejo CLI with gh's command surface
  smith manages Forgejo repositories, issues, pull requests, releases and
  Actions runs from the terminal, with the commands and flags of GitHub's gh.
homepage: https://github.com/Arzaroth/smith
license: MIT

depends:
  - git
overrides:
  deb:
    suggests:
      - libsecret-tools
      - xdg-utils
  rpm:
    suggests:
      - /usr/bin/secret-tool
      - xdg-utils

rpm:
  summary: Forgejo CLI with gh's command surface
  group: Development/Tools

contents:
  - src: smith
    dst: /usr/bin/smith
    file_info:
      mode: 0755
  - src: completions/smith.bash
    dst: /usr/share/bash-completion/completions/smith
  - src: completions/smith.fish
    dst: /usr/share/fish/vendor_completions.d/smith.fish
  - src: README.md
    dst: /usr/share/doc/smith-cli/README.md
    packager: deb
  - src: CHANGELOG.md
    dst: /usr/share/doc/smith-cli/CHANGELOG.md
    packager: deb
  - src: completions/_smith
    dst: /usr/share/zsh/vendor-completions/_smith
    packager: deb
  - src: LICENSE
    dst: /usr/share/doc/smith-cli/copyright
    packager: deb
  - src: lintian-overrides
    dst: /usr/share/lintian/overrides/smith-cli
    packager: deb
  - dst: /usr/share/doc/smith-cli
    type: dir
    packager: rpm
  - dst: /usr/share/licenses/smith-cli
    type: dir
    packager: rpm
  - src: README.md
    dst: /usr/share/doc/smith-cli/README.md
    type: doc
    packager: rpm
  - src: CHANGELOG.md
    dst: /usr/share/doc/smith-cli/CHANGELOG.md
    type: doc
    packager: rpm
  - src: completions/_smith
    dst: /usr/share/zsh/site-functions/_smith
    packager: rpm
  - src: LICENSE
    dst: /usr/share/licenses/smith-cli/LICENSE
    type: license
    packager: rpm
