name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  gate:
    runs-on: docker
    container:
      image: debian:trixie-slim
    steps:
      - name: Tools
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git nodejs xz-utils

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: mise
        uses: https://github.com/jdx/mise-action@v2

      - name: Gate
        run: mise run check
