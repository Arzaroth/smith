name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      MISE_YES: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          mise trust
          mise install

      - name: Gate
        run: mise run check

  native:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runs-on }}
    env:
      MISE_YES: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Zig
        run: |
          mise trust
          mise install zig

      - name: Test
        run: mise exec -- zig build test

  windows:
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Test
        run: zig build test

  # Zig 0.16.0 crashes (0xC0000005) when it compiles on arm64 Windows, so the
  # test binary for that runner is cross-compiled here and only run there.
  windows-arm64-tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      MISE_YES: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          mise trust
          mise install zig
          mise exec -- zig build test-exe -Dtarget=aarch64-windows

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-arm64-tests
          path: zig-out/bin/test.exe
          if-no-files-found: error

  windows-arm64:
    needs: windows-arm64-tests
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-arm64-tests
          path: ${{ runner.temp }}

      - name: Test
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\test.exe"
          exit $LASTEXITCODE
