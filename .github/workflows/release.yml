name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "mise-tasks/dist"
      - "mise-tasks/arch"
      - "mise-tasks/aur"
      - "install.sh"
      - ".mise.toml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.9.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
  MISE_YES: "1"

jobs:
  build:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            runs-on: ubuntu-latest
            gate: true
          - target: aarch64-linux-musl
            runs-on: ubuntu-24.04-arm
          - target: aarch64-macos
            runs-on: macos-latest
          - target: x86_64-macos
            runs-on: macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          mise trust
          mise install

      - name: Version
        run: |
          version="$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)"
          if [[ "$PUBLISH" == true && "${REF#refs/tags/}" != "v$version" ]]; then
            echo "::error::tag ${REF#refs/tags/} does not match build.zig.zon's version $version"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Gate
        if: matrix.gate
        run: mise run check

      - name: Test
        if: ${{ !matrix.gate }}
        run: mise exec -- zig build test

      - name: Package
        run: mise run dist ${{ matrix.target }} ${{ matrix.gate && '--source' || '' }}

      - name: The binary reports the version
        run: |
          tar -xzf "dist/smith-$VERSION-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP"
          printed="$("$RUNNER_TEMP/smith-$VERSION-${{ matrix.target }}/smith" --version)"
          echo "$printed"
          [[ "$printed" == "smith $VERSION" ]]
          rm dist/SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git pacman-contrib
          case "$(pacman -Si zig | awk '/^Version/ { print $3 }')" in
            0.16.*) pacman -S --noconfirm --needed zig ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The Linux archives and the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-linux-musl
          path: dist
          merge-multiple: true

      - name: Build the packages
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "bash mise-tasks/arch"
          mkdir out
          mv dist/smith-cli-bin-*.pkg.tar.zst dist/smith-*-pkgbuild.tar.gz out/

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch
          path: out/*
          if-no-files-found: error

  checksums:
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Signing key
        id: key
        env:
          KEY: ${{ secrets.SMITH_GPG_KEY }}
          PASSPHRASE: ${{ secrets.SMITH_GPG_PASSPHRASE }}
        run: |
          fpr=""
          if [[ -f packaging/smith.asc ]]; then
            fpr="$(gpg --show-keys --with-colons packaging/smith.asc | awk -F: '/^fpr/ { print $10; exit }')"
          fi
          if [[ -z "$KEY" ]]; then
            if [[ -n "$fpr" && "$PUBLISH" == true ]]; then
              echo "::error::packaging/smith.asc is committed, so a release needs the SMITH_GPG_KEY secret"
              exit 1
            fi
            echo "No signing key here: the files stay unsigned"
            exit 0
          fi
          if [[ -z "$fpr" ]]; then
            echo "::error::SMITH_GPG_KEY is set but packaging/smith.asc, its public half, is not committed"
            exit 1
          fi
          printf '%s' "$PASSPHRASE" >"$RUNNER_TEMP/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          if ! gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10 }' | grep -qx "$fpr"; then
            echo "::error::SMITH_GPG_KEY is not the key packaging/smith.asc publishes ($fpr)"
            exit 1
          fi
          sudo apt-get install -qq -y rpm >/dev/null
          echo "fpr=$fpr" >>"$GITHUB_OUTPUT"

      - name: Sign the packages
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          cd dist
          rpmsign --addsign \
            --define "__gpg $(command -v gpg)" \
            --define "_gpg_name $FPR" \
            --define "_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/passphrase" \
            -- *.rpm
          for pkg in *.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
              --local-user "$FPR" --detach-sign --no-armor --output "$pkg.sig" "$pkg"
          done
          cp ../packaging/smith.asc smith-release-key.asc

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        if: steps.key.outputs.fpr
        env:
          FPR: ${{ steps.key.outputs.fpr }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/passphrase" \
            --local-user "$FPR" --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -f "$RUNNER_TEMP/passphrase"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  verify-linux:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            deb: amd64
            rpm: x86_64
            pkg: x86_64
          - runs-on: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: The signatures
        if: hashFiles('dist/SHA256SUMS.asc') != ''
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --import packaging/smith.asc
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          docker run --rm -v "$PWD/dist:/d:ro" fedora:latest sh -ec '
            rpm --import /d/smith-release-key.asc
            rpm -K /d/smith-cli-*.${{ matrix.rpm }}.rpm | tee /dev/stderr | grep -q "signatures OK"'
          if [[ -n "${{ matrix.pkg }}" ]]; then
            fpr="$(gpg --show-keys --with-colons packaging/smith.asc | awk -F: '/^fpr/ { print $10; exit }')"
            docker run --rm -v "$PWD/dist:/d:ro" -e FPR="$fpr" archlinux:latest sh -ec '
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/smith-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
              for pkg in /d/smith-cli-bin-*.pkg.tar.zst; do
                pacman-key --verify "$pkg.sig" "$pkg"
              done'
          fi

      - name: The .deb on Debian 12
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" debian:12 sh -ec '
            apt-get update -qq >/dev/null
            apt-get install -qq -y /d/smith-cli_*_${{ matrix.deb }}.deb >/dev/null
            smith --version
            test -f /usr/share/man/man1/smith.1.gz
            test -f /usr/share/bash-completion/completions/smith'

      - name: The .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" fedora:latest sh -ec '
            if [ -f /d/smith-release-key.asc ]; then rpm --import /d/smith-release-key.asc; fi
            dnf install -q -y /d/smith-cli-*.${{ matrix.rpm }}.rpm
            smith --version
            rpm -V smith-cli'

      - name: The Arch package
        if: matrix.pkg
        run: |
          fpr=""
          if [[ -f packaging/smith.asc ]]; then
            fpr="$(gpg --show-keys --with-colons packaging/smith.asc | awk -F: '/^fpr/ { print $10; exit }')"
          fi
          docker run --rm -v "$PWD/dist:/d:ro" -e FPR="$fpr" archlinux:latest sh -ec '
            sed -i "/^NoExtract/d" /etc/pacman.conf
            pacman -Sy --noconfirm --needed git >/dev/null
            if [ -f /d/smith-release-key.asc ]; then
              pacman-key --init >/dev/null 2>&1
              pacman-key --add /d/smith-release-key.asc >/dev/null
              pacman-key --lsign-key "$FPR" >/dev/null
            fi
            pacman -U --noconfirm /d/smith-cli-bin-*-${{ matrix.pkg }}.pkg.tar.zst >/dev/null
            smith --version
            pacman -Qkk smith-cli-bin'

      - name: install.sh
        run: |
          version="$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)"
          forge="$(mktemp -d)"
          mkdir -p "$forge/releases/download/v$version"
          cp dist/* "$forge/releases/download/v$version/"
          SMITH_INSTALL_URL="file://$forge" sh install.sh --version "$version" --dir "$RUNNER_TEMP/bin"
          [[ "$("$RUNNER_TEMP/bin/smith" --version)" == "smith $version" ]]

  verify-macos:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        runs-on: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: install.sh
        run: |
          version="$(sed -n 's/^    \.version = "\([^"]*\)",$/\1/p' build.zig.zon)"
          forge="$(mktemp -d)"
          mkdir -p "$forge/releases/download/v$version"
          cp dist/* "$forge/releases/download/v$version/"
          SMITH_INSTALL_URL="file://$forge" sh install.sh --version "$version" --dir "$RUNNER_TEMP/bin"
          [[ "$("$RUNNER_TEMP/bin/smith" --version)" == "smith $version" ]]

  release:
    needs: [verify-linux, verify-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --draft --title "smith ${TAG#v}" --notes-file notes.md --repo "${{ github.repository }}"
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
